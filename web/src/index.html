<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sistema inteligente para buses</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <main class="layout">
      <section class="summary">
        <p class="eyebrow">v0.1.0 · HU-01 · EDT 3.2</p>
        <h1>Sistema inteligente para buses</h1>
        <p>Consulta rutas disponibles y prioriza la opcion con menor retraso y ocupacion.</p>

      <section class="panel" aria-labelledby="routes-title">
        <div class="panel-header">
          <h2 id="routes-title">Rutas recomendadas</h2>
          <button id="refresh" type="button">Actualizar</button>
        </div>
        <div id="routes" class="routes"></div>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
